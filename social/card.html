<!doctype html>
<!-- The social preview card. Rendered to og.png (1200×630) by social/render-og.sh. -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { display: grid; grid-template-columns: 430px 1fr; background: #e8ebee; font-family: "IBM Plex Sans", sans-serif; color: #1d2329; }
  .words { padding: 64px 0 56px 64px; display: flex; flex-direction: column; justify-content: space-between; }
  .eyebrow { font-family: "IBM Plex Mono", monospace; font-size: 18px; letter-spacing: .1em; text-transform: uppercase; color: #5b6670; }
  h1 { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 74px; line-height: .98; letter-spacing: -.03em; margin: 18px 0 0; }
  p { font-size: 24px; line-height: 1.35; margin: 22px 0 0; color: #3a434b; }
  code { font-family: "IBM Plex Mono", monospace; font-size: 21px; background: #fff; border: 1px solid #c5ccd3; border-radius: 6px; padding: 1px 7px; color: #1d2329; white-space: nowrap; }
  .url { font-family: "IBM Plex Mono", monospace; font-size: 18px; color: #c8452f; }
  .shot { position: relative; overflow: hidden; }
  /* the live page, pancakes, scaled down and cropped to the chart */
  iframe { position: absolute; border: 0; width: 1240px; height: 1500px; left: -30px; top: -146px; transform: scale(.66); transform-origin: 0 0; }
  .shot::after { content: ""; position: absolute; inset: auto 0 0 0; height: 90px; background: linear-gradient(transparent, #e8ebee); }
</style></head>
<body>
  <div class="words">
    <div>
      <div class="eyebrow">Cooklang spec 2.0</div>
      <h1>A recipe is a graph.</h1>
      <p>Name what a step makes with <code>-&gt; batter</code>, use it later with <code>@&amp;batter{}</code>, and the plain-text recipe draws itself.</p>
    </div>
    <div class="url">cooklang.github.io/spec-2.0-demo</div>
  </div>
  <div class="shot"><iframe src="../index.html#pancakes" title="Pancakes flow chart"></iframe></div>
</body></html>
